# Elgato Wave:3: evita que PipeWire suspenda el micrófono entre usos
# y fuerza el único formato que acepta (S24_3LE = "S24LE" en PipeWire).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-Elgato*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        audio.format = "S24LE"
      }
    }
  }
]
