name: macos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mac/**', 'install.sh', 'files.sh', '.bash*']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning install.sh mac/*.sh backup.sh files.sh

  instalar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Sin tty las preguntas responden No; brew ya existe en el runner
      - run: ./install.sh terminal dev < /dev/null
      - name: Comprobar programas
        run: |
          bash -lc 'for c in ghostty starship zed herdr; do command -v "$c" >/dev/null || { echo "falta $c"; exit 1; }; done'
